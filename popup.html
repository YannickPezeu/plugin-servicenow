<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #333;
      margin: 0;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 8px 0;
      color: #2e4153;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #5cb85c;
    }
    .info {
      color: #888;
      font-size: 11px;
      line-height: 1.4;
    }
    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 12px 0;
    }
    .config-section {
      margin-top: 8px;
    }
    .config-section label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #666;
      margin-bottom: 4px;
    }
    .config-section input {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    .config-section input:disabled {
      background-color: #f5f5f5;
    }
    .config-section select {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 3px;
      background-color: #fff;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }
    .toggle-row label {
      font-size: 12px;
      font-weight: 600;
      color: #444;
      margin: 0;
    }
    .toggle-row .sublabel {
      font-size: 10px;
      font-weight: 400;
      color: #888;
    }
    .switch {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background-color: #ccc;
      border-radius: 20px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .switch input:checked + .slider {
      background-color: #4a6785;
    }
    .switch input:checked + .slider::before {
      transform: translateX(16px);
    }
    .auth-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px;
      background: #f7f9fb;
      border: 1px solid #e1e7ed;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    .auth-info {
      font-size: 11px;
      line-height: 1.3;
      color: #555;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .auth-info .label {
      color: #888;
      font-size: 10px;
      display: block;
    }
    .auth-btn {
      padding: 4px 10px;
      font-size: 11px;
      border: 1px solid #4a6785;
      background: #fff;
      color: #4a6785;
      border-radius: 3px;
      cursor: pointer;
      white-space: nowrap;
    }
    .auth-btn.primary {
      background: #4a6785;
      color: #fff;
    }
    .auth-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .auth-error {
      color: #c0392b;
      font-size: 10px;
      margin-top: 4px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>SN AI Response Generator</h1>
  <div class="status">
    <div class="status-dot"></div>
    <span>Plugin actif</span>
  </div>
  <p class="info">
    Le bouton "Générer IA" est injecté automatiquement dans les pages de tickets ServiceNow.
  </p>
  <hr>
  <div class="auth-section">
    <div class="auth-info">
      <span class="label">Compte EPFL</span>
      <span id="auth-user">Non connecté</span>
    </div>
    <button id="auth-btn" class="auth-btn primary">Se connecter</button>
  </div>
  <div id="auth-error" class="auth-error"></div>
  <div style="display:flex; gap:6px; margin-bottom:8px;">
    <button id="auth-dump-btn" class="auth-btn" style="flex:1;">Voir token (console)</button>
    <button id="auth-copy-btn" class="auth-btn" style="flex:1;">Copier JWT</button>
  </div>
  <div class="config-section">
    <label>Groupe d'affectation</label>
    <input type="text" id="assignment-group-input" placeholder="Ex: apertus">
  </div>
  <div class="config-section">
    <label>Modele</label>
    <select id="model-select">
      <option value="moonshotai/Kimi-K2.6">Large : Kimi K2.6 (1T)</option>
      <option value="mistralai/Mistral-Small-3.2-24B-Instruct-2506-bfloat16">Small : Mistral Small 3.2 (24B)</option>
    </select>
  </div>
  <div class="config-section">
    <label>Top K</label>
    <div style="display: flex; align-items: center; gap: 8px;">
      <input type="range" id="topk-range" min="1" max="40" value="10" style="flex:1;">
      <span id="topk-value" style="font-size: 12px; min-width: 20px; text-align: right;">10</span>
    </div>
  </div>
  <div class="toggle-row">
    <div>
      <label>Rerank</label>
      <div class="sublabel">Plus precis, mais plus lent</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="rerank-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  <script src="oidc.js"></script>
  <script src="popup.js"></script>
</body>
</html>
