<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: #333;
      margin: 0;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 8px 0;
      color: #2e4153;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #5cb85c;
    }
    .info {
      color: #888;
      font-size: 11px;
      line-height: 1.4;
    }
    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 12px 0;
    }
    .config-section {
      margin-top: 8px;
    }
    .config-section label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #666;
      margin-bottom: 4px;
    }
    .config-section input {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    .config-section input:disabled {
      background-color: #f5f5f5;
    }
    .config-section select {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 3px;
      background-color: #fff;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }
    .toggle-row label {
      font-size: 12px;
      font-weight: 600;
      color: #444;
      margin: 0;
    }
    .toggle-row .sublabel {
      font-size: 10px;
      font-weight: 400;
      color: #888;
    }
    .switch {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background-color: #ccc;
      border-radius: 20px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .switch input:checked + .slider {
      background-color: #4a6785;
    }
    .switch input:checked + .slider::before {
      transform: translateX(16px);
    }
  </style>
</head>
<body>
  <h1>SN AI Response Generator</h1>
  <div class="status">
    <div class="status-dot"></div>
    <span>Plugin actif</span>
  </div>
  <p class="info">
    Le bouton "Générer IA" est injecté automatiquement dans les pages de tickets ServiceNow.
  </p>
  <hr>
  <div class="config-section">
    <label>Cle API</label>
    <input type="password" id="api-key-input" placeholder="Entrez votre cle API">
  </div>
  <div class="config-section">
    <label>Index Key</label>
    <input type="password" id="index-key-input" placeholder="Entrez votre index key">
  </div>
  <div class="config-section">
    <label>Modele</label>
    <select id="model-select">
      <option value="Qwen/Qwen3-VL-235B-A22B-Thinking">Qwen3 VL 235B Thinking</option>
      <option value="Qwen/Qwen3-VL-30B-A3B-Instruct">Qwen3 VL 30B</option>
      <option value="mistralai/Mistral-Small-3.2-24B-Instruct-2506">Mistral Small 3.2 24B</option>
    </select>
  </div>
  <div class="config-section">
    <label>Top K</label>
    <div style="display: flex; align-items: center; gap: 8px;">
      <input type="range" id="topk-range" min="1" max="40" value="10" style="flex:1;">
      <span id="topk-value" style="font-size: 12px; min-width: 20px; text-align: right;">10</span>
    </div>
  </div>
  <div class="toggle-row">
    <div>
      <label>Rerank</label>
      <div class="sublabel">Plus precis, mais plus lent</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="rerank-toggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
